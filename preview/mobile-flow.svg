<svg xmlns="http://www.w3.org/2000/svg" width="400" height="650" viewBox="0 0 400 650"><style>
 :host{display:block;container-type:inline-size;font-family:var(--paper-font-body1_-_font-family,Inter,Roboto,Arial,sans-serif)}
 *{box-sizing:border-box}ha-card{display:block;--card-bg:#10181e;color:#edf3f8;background:radial-gradient(ellipse at 50% 0,#172128 0,transparent 65%),#10181e;border:1px solid #28343c;border-radius:22px;overflow:hidden;box-shadow:0 14px 45px #0003;--muted:#a9b7c2;--surface:#14212a;--border:#293e4d;--ink:#edf3f8}
 ha-card.theme-ha{--card-bg:var(--ha-card-background,var(--card-background-color,#10181e));color:var(--primary-text-color,#edf3f8);background:var(--ha-card-background,var(--card-background-color,#10181e));--muted:var(--secondary-text-color,#a9b7c2);--surface:var(--secondary-background-color,#14212a);--border:var(--divider-color,#293e4d);--ink:var(--primary-text-color,#edf3f8)}
 .head{padding:24px 28px 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.head h2{font-size:clamp(19px,3.5cqi,28px);letter-spacing:-.6px;margin:0;font-weight:650}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#69caff;margin-bottom:7px}.subtitle{color:#a9b7c2;font-size:12px;margin:7px 0 0}.periods{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:10px 28px 0}
 button,input{font:inherit}button{cursor:pointer}.periods button{padding:6px 10px;background:transparent;color:#a9b7c2;border:1px solid transparent;border-radius:7px;font-size:12px}.periods button[aria-pressed=true]{background:#38b8ff17;color:#65c9ff;border-color:#38b8ff35}.periods button:hover{background:#38b8ff25}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #65c9ff;outline-offset:3px}.dates{display:flex;gap:10px;flex-wrap:wrap;padding:12px 28px;font-size:12px;color:#a9b7c2}input{color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:5px;max-width:160px;color-scheme:dark}.diagram{padding:8px 18px 0}.diagram svg{display:block;width:100%;height:auto;overflow:visible}svg text{fill:#edf3f8;font-family:inherit;text-anchor:middle}.label{font-size:15px;fill:#a9b7c2!important}.big{font-size:22px;font-weight:650;letter-spacing:-.4px}.small{font-size:12px;fill:#a9b7c2!important}.tiny{font-size:10px;fill:#a9b7c2!important}.ring{fill:#0b131a55;stroke:currentColor;stroke-width:2.5}.ring-halo{fill:none;stroke:currentColor;stroke-width:10;opacity:.055}.wire{fill:none;stroke:currentColor;stroke-width:2;opacity:.38;stroke-linecap:round}.wire.active{opacity:.9}.flow-dot{filter:drop-shadow(0 0 5px currentColor)}.symbol{color:inherit;filter:drop-shadow(0 0 7px currentColor)}.node{cursor:pointer}.node:focus{outline:none}.node:focus .ring,.node:hover .ring{stroke-width:4}.node:focus .tile,.node:hover .tile{stroke:currentColor;stroke-width:2}.note{font-size:11px;color:#a9b7c2;padding:8px 28px 17px;line-height:1.5}.error{color:#ff9e91;padding:8px 28px;font-size:12px}.footer{display:flex;align-items:center;justify-content:space-between;margin:0 28px;padding:17px 0;border-top:1px solid var(--border);color:#50c6ff;font-size:13px;text-decoration:none}.footer span:last-child{font-size:24px}.badge{font-size:11px;white-space:nowrap;color:#a9b7c2;padding-top:7px}.badge:before{content:'';display:inline-block;width:6px;height:6px;margin-right:7px;background:#68b8ed;border-radius:50%}
 @media(prefers-reduced-motion:reduce){.flow-dot{display:none}.symbol{filter:none}}
 .diagram svg.wide-flow{display:block}.diagram svg.narrow-flow{display:none}
 @container(max-width:480px){.head{padding:18px 18px 5px}.periods{padding-left:18px;padding-right:18px}.diagram{padding:0 5px}.head .badge{display:none}.note{padding-left:18px;padding-right:18px}.footer{margin:0 18px}}
 @container(max-width:720px){.diagram svg.wide-flow{display:none}.diagram svg.narrow-flow{display:block;max-width:440px;margin:0 auto}}

 .solar .diagram svg.narrow-flow{display:none}
 .solar .diagram svg.wide-flow{display:block}
 .chart{width:100%;height:auto;display:block}
 .solar{background:radial-gradient(ellipse at 45% 0,#10253066,transparent 65%),#081219;padding:14px;border-radius:20px}.solar .head{padding:9px 10px 8px}.solar .head h2{font-size:27px}.solar .periods{padding-left:10px;padding-right:10px}.panel{background:linear-gradient(140deg,#10202a66,#09151d99);border:1px solid #233947;border-radius:15px;overflow:hidden}.theme-ha .panel{background:var(--surface)}.flow-panel{margin-bottom:12px;padding-bottom:8px}.tile{fill:url(#tile-fill);stroke:#395462;stroke-width:1.1}.tile-value{font-size:25px;font-weight:650;letter-spacing:-.5px}.tile-label{font-size:14px;font-weight:600}.tile-detail{font-size:12px;fill:#a9b7c2!important}.tile-detail.left,.tile-value.left,.tile-label.left{text-anchor:start}.chart text{text-anchor:start;font-size:10px;fill:#a9b7c2}.chart .gridline{stroke:#263947;stroke-width:1;fill:none}.chart path.series{stroke-width:2;fill:none;stroke-linejoin:round}.lower{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px}.panel h3{font-size:16px;font-weight:600;padding:17px 16px 12px;margin:0}.chart-wrap{padding:0 12px}.legend{display:flex;gap:12px;flex-wrap:wrap;padding:10px 17px 17px;font-size:11px;color:#a9b7c2}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}.data-list{margin:0;padding:0 12px 13px}.data-row{display:flex;align-items:center;gap:8px;justify-content:space-between;min-height:38px;padding:8px;border-radius:8px;font-size:11px}.data-row:nth-child(odd){background:#20334135}.data-row dt{color:#a9b7c2;flex:1}.data-row dd{margin:0;text-align:right;font-weight:550;overflow-wrap:anywhere;max-width:55%}.row-dot{width:5px;height:17px;border-radius:4px;background:var(--row-color,#71caff)}.gauges{display:grid;grid-template-columns:1fr 1fr 1fr 1.4fr;gap:12px;margin-top:12px}.gauge{width:100%;display:block}.gauge .gauge-number{font-size:21px;font-weight:650}.gauge .gauge-label{font-size:10px;fill:#a9b7c2}.landscape{position:relative;min-height:200px;background:#112838}.landscape svg{width:100%;height:100%;display:block;position:absolute;inset:0}.landscape .caption{position:absolute;bottom:0;left:0;right:0;padding:45px 18px 17px;background:linear-gradient(transparent,#07131eee);font-size:15px;font-weight:550;line-height:1.4}.landscape small{font-size:10px;color:#b7d1dc;font-weight:400;display:block;margin-top:5px}.history-note{padding:0 16px 15px;color:#a9b7c2;font-size:11px}.solar .note{padding:12px 10px 2px}.flow-panel .diagram{padding:0 12px}.chart-empty{min-height:190px;display:grid;place-content:center;text-align:center;color:#a9b7c2;font-size:12px;padding:20px;line-height:1.6}
 @container(max-width:900px){.lower{grid-template-columns:1fr 1fr}.lower .history-panel{grid-column:1/-1}.gauges{grid-template-columns:1fr 1fr}.solar .head .badge{display:none}}
 .history-panel .chart{max-height:300px}.gauge{max-height:200px}
 @container(max-width:700px){.solar .diagram svg.wide-flow{display:none}.solar .diagram svg.narrow-flow{display:block;max-width:440px;margin:0 auto}}
 @container(max-width:480px){.solar{padding:8px}.lower{grid-template-columns:1fr}.gauges{grid-template-columns:1fr 1fr}.gauges h3{font-size:12px;padding:12px 10px}.landscape{min-height:155px}.landscape .caption{font-size:12px;padding:24px 10px 12px}.solar .head h2{font-size:22px}.solar .subtitle{font-size:10px}.data-row{font-size:12px}}
svg text{font-family:Arial,sans-serif;fill:#edf3f8} .narrow-flow{display:none}.label,.small,.tiny{fill:#a9b7c2}.wide-flow{display:block}.symbol{filter:none}.tile{fill:url(#tile-fill)}.gauge-number{font-size:21px;font-weight:650}.gauge-label{font-size:10px;fill:#a9b7c2}.chart text{font-size:10px;fill:#a9b7c2}.chart .gridline{stroke:#263947}.chart .series{fill:none;stroke-width:2}</style><rect x="1" y="1" width="398" height="648" rx="22" fill="#0d171e" stroke="#293b48"/><svg x="10" y="20" width="380" height="610" style="width:380px;height:610px" class="wide-flow" viewBox="0 0 380 650" role="group" aria-label="PV zum DC-Bus, Akku am DC-Bus, Inverter zum Haus, Haus und Netz"><g style="color:#ffc21b"><defs><marker id="arrow-n-ffc21b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#ffc21b" stroke-width="2"/></marker></defs><path class="wire active" d="M140 100H213" marker-end="url(#arrow-n-ffc21b)"/></g><g style="color:#b883ff"><defs><marker id="arrow-n-b883ff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#b883ff" stroke-width="2"/></marker></defs><path class="wire active" d="M275 162V242" marker-end="url(#arrow-n-b883ff)"/></g><g style="color:#42c8ea"><defs><marker id="arrow-n-42c8ea" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#42c8ea" stroke-width="2"/></marker></defs><path class="wire active" d="M275 366V371M275 399V448" marker-end="url(#arrow-n-42c8ea)"/></g><g style="color:#56ed88"><defs><marker id="arrow-n-56ed88" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#56ed88" stroke-width="2"/></marker></defs><path class="wire active" d="M255 159V196Q255 206 245 206H97Q78 206 78 226V242" marker-end="url(#arrow-n-56ed88)"/></g><g style="color:#42c8ea"><path class="wire active" d="M213 510H140" marker-start="url(#arrow-n-42c8ea)"/></g>
